name: ImportProof portable source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python tools/verify.py output/ci
      - name: Print failure logs
        if: failure()
        run: python -c "from pathlib import Path; [print(str(p),p.read_text(encoding='utf-8',errors='replace')[-20000:]) for p in Path('output').rglob('*.log')]"
      # This source-only CI does not prove an actual Excel/LibreOffice conversion workflow.
